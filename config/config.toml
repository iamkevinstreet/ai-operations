########################################################################
#                                                                      #
#                          config/config.toml                          #
#                                                                      #
########################################################################
# Author:            Kevin Street
# Created on:        2026-11-08
# Last modified on:  2026-11-09
#
# Every setting the loaders, the build and the DAGs read, at its
# default. No secrets: those go in config/.env.
#
# Each key's name is its section and key joined: [warehouse] path is
# warehouse_path, and the environment variable WAREHOUSE_PATH overrides
# it. A nested table is one setting: [ai_ops.apps] is ai_ops_apps. A
# test keeps this file equal to the defaults in code: this project's
# own in pipelines/config.py, the shared ones in kds.pipelines.

[warehouse]
destination = "duckdb"                    # duckdb (one file, here and in CI) | databricks
path = "data/generated/warehouse.duckdb"  # the DuckDB file dlt loads and dbt builds in
state = "data/generated/dlt"              # dlt's pipeline state: what each load did

[dbt]
project = "dbt"                           # the dbt project, whose profiles.yml it also holds
target = "dev"                            # dev: DuckDB | prod: Databricks
threads = 4                               # models dbt builds at once

[github]
api = "https://api.github.com"            # lists a commit's files
raw = "https://raw.githubusercontent.com" # serves a file at a commit
owner = "iamkevinstreet"                  # whose repositories the results come from
timeout_s = 30.0                          # how long one request may take

[ai_ops]
dataset = "raw_ai_ops"                    # the schema the apps' results load into
results = "data/evals/results"            # where each app commits its run files
prices_repo = "utils"                     # the workbench, whose price list costed every call
prices_path = "llm/kds/llm/pricing.json"
# Every version of the price list, by the utils commit that holds it, so a
# fresh warehouse rebuilds the price history; add a commit when prices change.
prices_commits = ["97157184471beb28ed129eb52086c36f76ef3e55"]

# Each app's results at one reviewed commit: a load is repeatable, and a new
# run reaches the warehouse only when its pin moves. These are each app's
# main after the Nov 8 merges; move a pin when a new run is published.
[ai_ops.apps]
grounded-qa = "5226cbf61bcdf74eb6794e5266d38fc8c1c453de"
intake-conflicts-agent = "97d4c52ab7495d2f47491ee7c65cc93cb7ca95b9"
eeoc-charge-intake = "bae5b7c9f588a334fad3280e171a8052b2220c03"

[databricks]
catalog = "kds"                           # the Unity Catalog catalog every schema lives in

[files]
encoding = "utf-8"                        # every file read or written

[log]
dir = "logs"                              # one YYYY-MM-DD.jsonl file per day
level = "INFO"                            # DEBUG | INFO | WARNING | ERROR
