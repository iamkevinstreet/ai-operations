# Author:            Kevin Street
# Created on:        2026-11-08
# Last modified on:  2026-11-09
#
# The one dbt project: staging views over the raw tables dlt loads,
# intermediate views that line the apps' formats up, and a published
# mart per domain, each a table with an enforced contract. The same
# models build in DuckDB (dev, CI) and Databricks (prod).

name: ai_operations
version: "0.1.0"
config-version: 2
profile: ai_operations

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
clean-targets: ["target", "logs"]

# No usage data leaves the machine, and no version check calls out.
flags:
  send_anonymous_usage_stats: false
  version_check: false

models:
  ai_operations:
    # One view per raw table: renamed, cast, nothing joined.
    staging:
      +schema: staging
      +materialized: view
    # The apps' formats lined up to one grain, for the marts to share.
    intermediate:
      +schema: intermediate
      +materialized: view
    # The published marts: tables with contracts, which other projects may use.
    ai_ops:
      +schema: ai_ops
      +materialized: table
      +group: ai_ops
      +access: public
      +contract:
        enforced: true

seeds:
  ai_operations:
    +schema: reference

data_tests:
  ai_operations:
    +severity: error
