########################################################################
#                                                                      #
#                     .github/workflows/daily.yml                      #
#                                                                      #
########################################################################
# Author:            Kevin Street
# Created on:        2026-11-08
# Last modified on:  2026-11-10
#
# Runs the DAGs every day through Airflow itself, with `airflow dags
# test`, so there is no Airflow server to pay for: the loads, then the
# build, on DuckDB. Once the AWS_REGION variable is set, a run on main
# copies the warehouse and its docs under ai-operations/ in the lake
# bucket that data-platform-aws-databricks provisions, through GitHub's
# OIDC token, since the role trusts main only; once DATABRICKS_CATALOG
# is set, the same loads and models run there too, from any branch run
# by hand; once SNOWFLAKE_DATABASE is set, they run in Snowflake, the
# load and then the build, each job signed in as its own service user
# with GitHub's OIDC token in an environment only main may use, so no
# key exists for either. Whatever names an account (the role, the
# bucket, the workspace's host, the warehouse's path, the token, the
# Snowflake account) is a secret, so this public repository's logs mask
# it; the three variables say only which steps run.

name: daily

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  duckdb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # only for the AWS role, through GitHub's OIDC token
    env:
      RUNTIME__DLTHUB_TELEMETRY: "false"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"

      - name: Install the locked environment with Airflow
        run: uv sync --locked --group airflow

      - name: Each DAG end to end through Airflow
        run: make dags-test

      - name: The docs site, with its lineage graph
        run: make docs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: warehouse-${{ github.run_id }}
          path: |
            data/generated/warehouse.duckdb
            dbt/target/static_index.html
          retention-days: 30

      - name: Sign in to AWS as the CI role
        id: aws
        if: vars.AWS_REGION != '' && github.ref == 'refs/heads/main'
        # yamllint disable-line rule:line-length
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      # When AWS refuses the token, show what it claimed, so the role's trust
      # policy can be matched to it. Only the decoded claims are printed,
      # never the token: the subject, audience and branch name nothing secret.
      - name: Show the OIDC claims the role was offered
        if: failure() && steps.aws.outcome == 'failure'
        run: |
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import base64, json, sys
          part = json.load(sys.stdin)["value"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          print({key: claims[key] for key in ("sub", "aud", "ref")})'

      - name: Copy the warehouse and its docs to the lake, under this project's prefix, by date
        if: vars.AWS_REGION != '' && github.ref == 'refs/heads/main'
        env:
          BUCKET: ${{ secrets.LAKE_BUCKET }}
        run: |
          day="$(date -u +%Y-%m-%d)"
          aws s3 cp data/generated/warehouse.duckdb \
            "s3://${BUCKET}/ai-operations/warehouse/${day}/warehouse.duckdb"
          aws s3 cp dbt/target/static_index.html \
            "s3://${BUCKET}/ai-operations/docs/${day}/index.html"

  databricks:
    if: vars.DATABRICKS_CATALOG != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNTIME__DLTHUB_TELEMETRY: "false"
      GITHUB_TOKEN: ${{ github.token }}
      WAREHOUSE_DESTINATION: databricks
      DBT_TARGET: prod
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"

      - name: Install the locked environment with the Databricks adapters
        run: uv sync --locked --group databricks

      - name: Load every app's results into Databricks
        run: make load

      - name: Build and test every model on Databricks
        run: make build

  snowflake-load:
    if: vars.SNOWFLAKE_DATABASE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: snowflake-load
    permissions:
      contents: read
      id-token: write  # signs in to Snowflake as this job's service user, with GitHub's OIDC token
    env:
      RUNTIME__DLTHUB_TELEMETRY: "false"
      GITHUB_TOKEN: ${{ github.token }}
      WAREHOUSE_DESTINATION: snowflake
      DBT_TARGET: snowflake
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - name: Keep the account out of the log in either case, as GitHub matches a secret exactly
        run: |
          account="${SNOWFLAKE_ACCOUNT#https://}"
          account="${account%%.*}"
          echo "::add-mask::${account,,}"
          echo "::add-mask::${account^^}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"

      - name: Install the locked environment with the Snowflake adapters
        run: uv sync --locked --group snowflake

      - name: Load every app's results into Snowflake
        run: make load

  snowflake-build:
    needs: snowflake-load
    if: vars.SNOWFLAKE_DATABASE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: snowflake-build
    permissions:
      contents: read
      id-token: write  # signs in to Snowflake as this job's service user, with GitHub's OIDC token
    env:
      WAREHOUSE_DESTINATION: snowflake
      DBT_TARGET: snowflake
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - name: Keep the account out of the log in either case, as GitHub matches a secret exactly
        run: |
          account="${SNOWFLAKE_ACCOUNT#https://}"
          account="${account%%.*}"
          echo "::add-mask::${account,,}"
          echo "::add-mask::${account^^}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"

      - name: Install the locked environment with the Snowflake adapters
        run: uv sync --locked --group snowflake

      - name: Build and test every model on Snowflake
        run: make build
