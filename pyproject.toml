########################################################################
#                                                                      #
#                            pyproject.toml                            #
#                                                                      #
########################################################################
# Author:            Kevin Street
# Created on:        2026-11-08
# Last modified on:  2026-11-08
#
# Packages the loaders and the build command, and sets ruff, mypy and
# pytest to the code standard. Airflow and the Databricks adapters are
# dependency groups of their own: the DAGs only start commands, so the
# scheduler never imports the loaders, and CI installs each group only
# where it runs.

[project]
name = "data-platform"
version = "0.1.0"
description = "The warehouse behind the AI projects: dlt loads, dbt models, Airflow schedules."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "kds-args>=0.6.0,<0.7",
  "kds-settings>=0.6.0,<0.7",
  "kds-logs>=0.6.0,<0.7",
  # dlt supports DuckDB below 2.0, so the lock holds DuckDB 1.5.
  "dlt[duckdb]==1.32.0",
  "dbt-core==1.12.6",
  "dbt-duckdb==1.11.1",
  "openpyxl>=3.1",
]

[project.scripts]
pipelines = "pipelines.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "python-hcl2>=7",
  "ruff==0.17.3",
  "types-openpyxl>=3.1",
  "types-PyYAML>=6.0",
  "types-requests>=2.32",
  "kds-standards>=0.6.0,<0.7",
]
# The scheduler, for the DAG tests and for running a DAG end to end with `airflow dags test`.
airflow = ["apache-airflow==3.4.0"]
# The production warehouse: dbt's Databricks adapter and dlt's Databricks destination.
databricks = ["dbt-databricks==1.13.0", "dlt[databricks]==1.32.0"]

# Our own packages come from the utils repository at one reviewed commit; none
# of them is on PyPI, so a same-named public package can never be installed.
[tool.uv.sources]
kds-args = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "args", rev = "97157184471beb28ed129eb52086c36f76ef3e55" }
kds-settings = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "settings", rev = "97157184471beb28ed129eb52086c36f76ef3e55" }
kds-logs = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "logs", rev = "97157184471beb28ed129eb52086c36f76ef3e55" }
kds-standards = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "standards", rev = "97157184471beb28ed129eb52086c36f76ef3e55" }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipelines*"]

[tool.ruff]
line-length = 99
target-version = "py312"
src = [".", "tests", "dags"]
extend-exclude = ["dbt/target", "dbt/logs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "BLE", "S", "C90", "PL", "RUF", "G", "D", "ANN"]
# A module's doc block opens with its fields (Author and the dates), not a summary, so the
# summary-first docstring rules do not fit it; kds-standards checks every function's doc block.
ignore = ["D205", "D212", "D415", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["pipelines", "support", "defaults"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 5

[tool.ruff.lint.per-file-ignores]
# Tests assert and repeat expected values inline.
"tests/**" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Every warning fails a test, but one: Airflow's own file discovery uses a pathspec pattern
# that pathspec has deprecated, which nothing here can change.
filterwarnings = ["error", "ignore:GitWildMatchPattern:DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pipelines", "tests", "dags"]
# The tests import their helpers, and the DAGs their defaults, as Airflow puts them on the path.
mypy_path = ["tests", "dags"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["dlt", "dlt.*", "dbt", "dbt.*", "hcl2", "airflow", "airflow.*"]
ignore_missing_imports = true
